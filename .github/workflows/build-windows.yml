name: Build DNA-Aeon for Windows ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show architecture
        shell: pwsh
        run: |
          Write-Host "Architecture:"
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          Write-Host "Processor:"
          $env:PROCESSOR_ARCHITECTURE

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Check Python and pip platform
        shell: pwsh
        run: |
          python -c "import platform, sys, sysconfig; print('Python:', sys.version); print('Machine:', platform.machine()); print('Platform:', sysconfig.get_platform())"
          python -m pip debug --verbose

      - name: Create NOREC4DNA virtual environment
        run: |
          python -m venv NOREC4DNA\venv

      - name: Install NOREC4DNA dependencies
        run: |
          NOREC4DNA\venv\Scripts\python.exe -m pip install --upgrade pip
          NOREC4DNA\venv\Scripts\python.exe -m pip install wheel
          NOREC4DNA\venv\Scripts\python.exe -m pip install -r NOREC_requirements.txt

      - name: Patch Zippy submodule for Windows
        shell: pwsh
        run: |
          $file = "Zippy/library/Zippy/ZipArchive.hpp"

          if (-not (Test-Path $file)) {
            Write-Error "ZipArchive.hpp was not found at $file"
            exit 1
          }

          $content = Get-Content -Path $file -Raw

          if ($content -notmatch '#include <direct\.h>') {
            $content = $content -replace '#include <fstream>', "#include <fstream>`r`n`r`n#ifdef _WIN32`r`n#include <direct.h>`r`n#else`r`n#include <sys/stat.h>`r`n#endif"
          }

          Set-Content -Path $file -Value $content -NoNewline

          Write-Host "Zippy Windows directory headers patched."

      

      - name: Patch Abseil for MSVC
        shell: pwsh
        run: |
          $file = "abseil-cpp/absl/time/internal/cctz/include/cctz/civil_time_detail.h"

          if (-not (Test-Path $file)) {
            Write-Error "civil_time_detail.h was not found at $file"
            exit 1
          }

          $content = Get-Content $file -Raw

          $content = $content.Replace(
            "static CONSTEXPR_F civil_time(max)()",
            "static CONSTEXPR_F auto (max)() -> civil_time"
          )

          $content = $content.Replace(
            "static CONSTEXPR_F civil_time(min)()",
            "static CONSTEXPR_F auto (min)() -> civil_time"
          )

          Set-Content -Path $file -Value $content -NoNewline

          Write-Host "Abseil civil_time max/min declarations patched."

      - name: Configure CMake
        run: |
          cmake -S . -B build -A ARM64

      - name: Build DNA-Aeon
        run: |
          cmake --build build --config Release --parallel

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build -Filter *.exe

      - name: Upload ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: dna-aeon-windows-arm64
          path: build/Release/arithmetic_modulator_error_correction.exe
