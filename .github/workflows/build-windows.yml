name: Build DNA-Aeon for Windows ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show architecture
        shell: pwsh
        run: |
          Write-Host "Architecture:"
          [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          Write-Host "Processor:"
          $env:PROCESSOR_ARCHITECTURE

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Check Python and pip platform
        shell: pwsh
        run: |
          python -c "import platform, sys, sysconfig; print('Python:', sys.version); print('Machine:', platform.machine()); print('Platform:', sysconfig.get_platform())"
          python -m pip debug --verbose

      - name: Create NOREC4DNA virtual environment
        run: |
          python -m venv NOREC4DNA\venv

      - name: Install NOREC4DNA dependencies
        run: |
          NOREC4DNA\venv\Scripts\python.exe -m pip install --upgrade pip
          NOREC4DNA\venv\Scripts\python.exe -m pip install wheel
          NOREC4DNA\venv\Scripts\python.exe -m pip install -r NOREC_requirements.txt

      - name: Patch Zippy submodule for Windows
        shell: pwsh
        run: |
          $file = "Zippy/library/Zippy/ZipArchive.hpp"

          if (-not (Test-Path $file)) {
            Write-Error "ZipArchive.hpp not found"
            exit 1
          }

          $content = Get-Content $file -Raw

          # Add filesystem header.
          if (-not $content.Contains("#include <filesystem>")) {
            $content = $content.Replace(
              "#include <fstream>",
              "#include <fstream>`r`n#include <filesystem>"
            )
          }

          # Replace Zippy's Windows mkdir call.
          $old = '_mkdir((dest + entry.Filename()).c_str());'
          $new = 'std::filesystem::create_directory(dest + entry.Filename());'

          if (-not $content.Contains($old)) {
            Write-Error "Zippy _mkdir call was not found"
            exit 1
          }

          $content = $content.Replace($old, $new)

          Set-Content $file $content -NoNewline

          Write-Host "Zippy patch completed successfully."

      

      - name: Patch Abseil for MSVC
        shell: pwsh
        run: |
          $file = "abseil-cpp/absl/time/internal/cctz/include/cctz/civil_time_detail.h"

          if (-not (Test-Path $file)) {
            Write-Error "civil_time_detail.h was not found at $file"
            exit 1
          }

          $content = Get-Content $file -Raw

          $content = $content.Replace(
            "static CONSTEXPR_F civil_time(max)()",
            "static CONSTEXPR_F auto (max)() -> civil_time"
          )

          $content = $content.Replace(
            "static CONSTEXPR_F civil_time(min)()",
            "static CONSTEXPR_F auto (min)() -> civil_time"
          )

          Set-Content -Path $file -Value $content -NoNewline

          Write-Host "Abseil civil_time max/min declarations patched."

      - name: Patch DNA-Aeon main.cpp for MSVC ARM64
        shell: pwsh
        run: |
          $file = "cpp/src/main.cpp"

          if (-not (Test-Path $file)) {
            Write-Error "main.cpp not found"
            exit 1
          }

          $content = Get-Content $file -Raw

          # Fix the encode ThreadPool construction.
          $old = 'absl::synchronization_internal::ThreadPool pool(static_cast<int>(min(static_cast<unsigned long>(config["general"]["threads"]),ents.size())));'
          $new = 'const int threadCount = static_cast<int>(std::min<std::size_t>(static_cast<std::size_t>(config["general"]["threads"]), ents.size()));' + [Environment]::NewLine + '    absl::synchronization_internal::ThreadPool pool(threadCount);'

          if ($content.Contains($old)) {
            $content = $content.Replace($old, $new)
          }

          # Remove the literal backtick characters accidentally inserted
          # by the previous patch, if this workflow has already run once.
          $content = $content.Replace('`r`n', [Environment]::NewLine)

          # Fix JSON path arguments for MSVC.
          $content = $content.Replace(
            'ifstream outin(config["encode"]["output"]);',
            'ifstream outin(config["encode"]["output"].get<string>());'
          )

          $content = $content.Replace(
            'ofstream confout(config["encode"]["output"]);',
            'ofstream confout(config["encode"]["output"].get<string>());'
          )

          $content = $content.Replace(
            'ifstream iStream(config["decode"]["input"]);',
            'ifstream iStream(config["decode"]["input"].get<string>());'
          )

          $content = $content.Replace(
            'ofstream out(config["decode"]["output"], ios::out | ios::binary);',
            'ofstream out(config["decode"]["output"].get<string>(), ios::out | ios::binary);'
          )

          Set-Content $file $content -NoNewline

          Write-Host "main.cpp MSVC ARM64 compatibility patch completed."

      - name: Configure CMake
        run: |
          cmake -S . -B build -A ARM64

      - name: Build DNA-Aeon
        run: |
          cmake --build build --config Release --parallel

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build -Filter *.exe

      - name: Upload ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: dna-aeon-windows-arm64
          path: build/Release/arithmetic_modulator_error_correction.exe
